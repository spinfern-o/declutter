# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  workflow_dispatch:  # run by hand after uploading new 3D models: gh workflow run fly-deploy.yml --ref main
  push:
    branches:
      - main
      - master
    paths:  # only the server lives on Fly; app-only changes don't redeploy it
      - backend/**
      - .github/workflows/fly-deploy.yml
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      # best.pt is gitignored; it lives on the "model" release. To ship a newly promoted model:
      #   gh release upload model backend/models/best.pt --clobber
      - run: gh release download model --pattern best.pt --dir backend/models
        env:
          GH_TOKEN: ${{ github.token }}
      # the 3D item models live on the "models-3d" release. To ship a new or changed one (file names: a-z, 0-9, _):
      #   gh release upload models-3d <name>.usdz --clobber   then   gh workflow run fly-deploy.yml --ref main
      # Any failure fails the deploy, since shipping no models would make every phone delete the ones it has.
      # So the release must always hold at least one .usdz.
      - run: gh release download models-3d --pattern '*.usdz' --dir backend/models3d
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        working-directory: backend  # fly.toml, Dockerfile and the build context all live here
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
